# Local development template; copy to application.yaml before building.
# Supply secrets through the environment or a local, ignored .env file.
server:
  address: 127.0.0.1
  port: ${USER_SERVICE_PORT:8081}
  forward-headers-strategy: none
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: s-user
  cloud:
    nacos:
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            s-server:
            - uri: http://127.0.0.1:${CHAT_SERVICE_PORT:8082}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:schat}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USERNAME:schat}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 15
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration/user
    table: flyway_schema_history_user
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: jwt
  is-log: false
  jwt-secret-key: ${SCHAT_JWT_SECRET}
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
schat:
  internal:
    secret: ${SCHAT_INTERNAL_SECRET}
  login:
    trusted-proxies: ${SCHAT_LOGIN_TRUSTED_PROXIES:}
feign:
  sentinel:
    enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
