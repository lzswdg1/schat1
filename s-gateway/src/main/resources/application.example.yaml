# Local development template; copy to application.yaml before building.
# Supply secrets through the environment or a local, ignored .env file.
server:
  address: 127.0.0.1
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: none
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: s-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
      - id: auth
        uri: http://127.0.0.1:${USER_SERVICE_PORT:8081}
        predicates:
        - Path=/api/auth/**
        filters:
        - StripPrefix=1
      - id: users
        uri: http://127.0.0.1:${USER_SERVICE_PORT:8081}
        predicates:
        - Path=/api/user/**,/api/friend/**
        filters:
        - StripPrefix=1
      - id: groups
        uri: http://127.0.0.1:${CHAT_SERVICE_PORT:8082}
        predicates:
        - Path=/api/group/**
        filters:
        - StripPrefix=1
      - id: chat
        uri: http://127.0.0.1:${CHAT_SERVICE_PORT:8082}
        predicates:
        - Path=/api/chat/**
        filters:
        - StripPrefix=1
      - id: files
        uri: http://127.0.0.1:${FILE_SERVICE_PORT:8083}
        predicates:
        - Path=/api/file/**
        filters:
        - StripPrefix=1
      - id: websocket
        uri: ws://127.0.0.1:${CHAT_SERVICE_PORT:8082}
        predicates:
        - Path=/api/ws/**
        filters:
        - StripPrefix=1
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  is-concurrent: true
  is-share: true
  token-style: jwt
  is-log: false
  jwt-secret-key: ${SCHAT_JWT_SECRET}
logging:
  level:
    org.springframework.cloud.gateway: INFO
